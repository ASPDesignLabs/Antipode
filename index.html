<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Antipode</title>
<style>
  :root { --hd: 200; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; font: 600 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
         letter-spacing: .14em; text-transform: uppercase; color: hsl(var(--hd), 80%, 72%); text-shadow: 0 0 12px hsl(var(--hd), 90%, 55%);
         user-select: none; -webkit-user-select: none; }
  #title { position: absolute; top: 4.5vh; left: 0; right: 0; text-align: center; font-size: 12px; opacity: .55; }
  #mode { position: absolute; top: 7.5vh; left: 0; right: 0; text-align: center; font-size: clamp(22px, 5vh, 44px); letter-spacing: .3em; }
  #msg { position: absolute; top: 58%; left: 0; right: 0; padding: 0 24px; text-align: center; white-space: pre-line; opacity: .85;
         animation: breathe 2.4s ease-in-out infinite; }
  #score { position: absolute; bottom: 5vh; left: 0; right: 0; text-align: center; font-size: clamp(28px, 7vh, 64px); font-weight: 300; }
  [data-state="play"] #mode, [data-state="play"] #title { opacity: 0; }
  #fail { white-space: pre-wrap; word-break: break-word; position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #ddd; background: #000;
          font: 16px system-ui, sans-serif; padding: 24px; text-align: center; }
  #fail[hidden] { display: none; }
  @keyframes breathe { 50% { opacity: .35; } }
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="hud">
  <div id="title">Antipode</div>
  <div id="mode"></div>
  <div id="msg"></div>
  <div id="score"></div>
</div>
<div id="fail" hidden></div>
<script src="src/hue.js"></script>
<script src="src/audio.js"></script>
<script src="src/input.js"></script>
<script src="src/engine.js"></script>
<script src="modes/afterimage.js"></script>
<script src="src/main.js"></script>
</body>
</html>
